name: Bot Commit

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "File to update/create (e.g. index.php)"
        required: true
      content:
        description: "Content to write into the file"
        required: true

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Git
        run: |
          git config --global user.name "AIMafiaAgent"
          git config --global user.email "bradleyturnauiwe@gmail.com"

      - name: Apply file change
        run: |
          echo "${{ github.event.inputs.content }}" > "${{ github.event.inputs.filename }}"
          git add "${{ github.event.inputs.filename }}"
          git commit -m "Bot updated ${{ github.event.inputs.filename }}"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
