name: Bot Commit Test

on:
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Git
        run: |
          git config --global user.name "AIMafiaAgent"
          git config --global user.email "bradleyturnauiwe@gmail.com"
      - name: Make a test commit
        run: |
          echo "Bot was here at $(date)" >> bot-log.txt
          git add bot-log.txt
          git commit -m "Bot: test commit"
     - name: Push changes
  uses: ad-m/github-push-action@v0.6.0
  with:
    github_token: ${{ secrets.GITHUB_TOKEN }}
    branch: main

