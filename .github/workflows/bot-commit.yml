name: Bot Commit Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"   # daily at 12:00 UTC

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow pushing commits
    steps:
      - uses: actions/checkout@v3

      - name: Set up Git
        run: |
          git config --global user.name "AIMafiaAgent"
          git config --global user.email "bradleyturnauiwe@gmail.com"

      - name: Make a test commit
        run: |
          echo "Bot was here at $(date)" >> bot-log.txt
          git add bot-log.txt
          git commit -m "Bot: test commit" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
